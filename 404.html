sk pruža usluge direktne kupovine i prodaje USDT-⁠a i USDC-⁠a za BAM i EUR, uz uslugu čuvanja digitalne imovine.",otc:"OTC znači da trgujete direktno sa nama, a ne na berzi.",cta:"Kontaktirajte desk",buy:"Želim da kupim",sell:"Želim da prodam",switchLabel:"Izaberite šta želite da uradite",buyLeft:"Vi šaljete BAM ili EUR",buyRight:"Vi primate USDT ili USDC",sellLeft:"Vi primate BAM ili EUR",sellRight:"Vi šaljete USDT ili USDC",ribbonAlt:"Plava traka. Na jednoj strani su BAM i EUR. Traka se okreće, a na drugoj strani su USDT i USDC.",loopAlt:"Petlja od plave trake. BAM i EUR se kreću gornjom stranom. Traka se okreće, a USDT i USDC se vraćaju donjom stranom.",rollAlt:"Rolna plave trake u staklenoj kutiji."},services:{h2:"Šta radimo",items:[{name:"OTC trgovina stabilnim kriptovalutama",lead:"Kupite ili prodajte USDT i USDC za BAM ili EUR.",points:["Prije razmjene dobijate jednu fiksnu cijenu. Možete je prihvatiti ili odbiti.","Vesk je druga ugovorna strana u svakoj razmjeni. Nema knjige naloga ni platforme za trgovanje.","Poslujete sa osobom na našem desku, a ne preko aplikacije.","Poslije svake razmjene dobijate pismenu potvrdu."]},{name:"Čuvanje digitalne imovine",lead:"Čuvamo digitalnu imovinu za klijente.",points:["Vaša imovina se čuva odvojeno od imovine Veska.","Imovinu prenosimo samo po Vašem nalogu i samo na novčanik za koji ste potvrdili da je Vaš.","Izvještaj o stanju Vaše imovine možete zatražiti u svakom trenutku."]}]},pairs:{h2:"Parovi kojima trgujemo",lead:"Svakim parom trgujemo u oba smjera. Možete kupiti ili prodati.",names:{BAM:"Konvertibilna marka",EUR:"Evro",USDT:"Tether",USDC:"USD Coin"},notes:["BAM je konvertibilna marka, valuta Bosne i Hercegovine.","USDT i USDC su stabilne kriptovalute. Napravljene su tako da održavaju stabilnu vrijednost."],both:"oba smjera"},how:{h2:"Kako izgleda razmjena",steps:[{t:"Kontaktirajte desk",d:"Recite nam šta želite da kupite ili prodate i u kojem iznosu."},{t:"Provjeravamo ko ste",d:"Prije prve razmjene provjeravamo Vaš identitet. Pravna lica dostavljaju i dokumentaciju firme. Provjera identiteta se obavlja preko servisa iDenfy."},{t:"Dogovaramo cijenu",d:"Šaljemo Vam jednu fiksnu cijenu. Ništa se ne dešava dok je ne prihvatite."},{t:"Vi šaljete svoj dio",d:"Šaljete BAM ili EUR u svoje ime ili stabilne kriptovalute sa novčanika za koji ste potvrdili da je Vaš. Ne primamo gotovinu ni uplate trećih lica."},{t:"Mi šaljemo svoj dio",d:"Šaljemo stabilne kriptovalute na Vaš novčanik ili Vam šaljemo BAM ili EUR. Dobijate pismenu potvrdu."}]},checks:{h2:"Provjeravamo svakog klijenta i svaku razmjenu",items:[{t:"Prvo identitet",d:"Nijedan klijent ne trguje prije nego što provjerimo njegov identitet. Za provjeru ličnih isprava i poređenje lica sa fotografijom na ispravi koristimo iDenfy."},{t:"Svaka razmjena se provjerava",d:"Svaku transakciju i svaki novčanik provjeravamo u skladu sa propisima o sprečavanju pranja novca i finansiranja terorističkih aktivnosti."},{t:"Prijavljujemo kada zakon to nalaže",d:"Sumnjive transakcije prijavljujemo Finansijsko-obavještajnom odjeljenju, u skladu sa zakonom."},{t:"Čuvamo evidencije",d:"Evidencije o klijentima i razmjenama čuvamo onoliko dugo koliko zakon nalaže."}],notTitle:"Šta Vesk ne radi",not:["Nema platforme za trgovanje ni knjige naloga.","Ne dajemo investicione savjete.","Ne primamo gotovinu."]},risk:{h2:"Upozorenje o rizicima",p:["Republika Srpska, Komisija za hartije od vrijednosti Republike Srpske i drugi organ javnog sektora ne garantuju za vrijednost virtuelnih valuta i ne snose odgovornost za bilo koju eventualnu štetu i gubitke koje korisnici i drugi imaoci virtuelnih valuta ili lica koja pružaju usluge povezane sa virtuelnim valutama, odnosno treća lica, pretrpe u vezi sa obavljanjem transakcija sa virtuelnim valutama.","Obavljanje transakcija sa virtuelnim valutama nosi rizike, uključujući rizik od djelimičnog ili potpunog gubitka novčanih sredstava, odnosno druge imovine. Na transakcije sa virtuelnim valutama ne primjenjuju se pro
